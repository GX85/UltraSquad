<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UltraSquad · Просмотр эфира</title><link rel="stylesheet" href="./broadcast.css"><script type="module" src="./viewer.js"></script></head>
<body><main><header><a class="brand" href="./">ULTRASQUAD</a><span>ПРОСМОТР</span></header><h1>Видеоэфир</h1><p>Попросите оператора прислать приглашение. Отправьте ему код ответа, чтобы подключиться к эфиру.</p>
<div class="stage"><video id="video" autoplay muted playsinline controls></video><p id="status" aria-live="polite">Ожидание приглашения</p></div>
<section class="connect"><label for="offer">Приглашение оператора</label><textarea id="offer" rows="3" spellcheck="false"></textarea><button id="join" type="button">Создать код ответа</button><label for="answer">Код ответа для оператора</label><textarea id="answer" rows="3" readonly></textarea><button id="copy" type="button" disabled>Копировать ответ</button><p>Для подключения браузерам нужен прямой сетевой маршрут. Если удалённое соединение недоступно, попробуйте подключиться из одной сети.</p></section></main></body></html>
