<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UltraSquad · Видеоэфир</title><link rel="stylesheet" href="./broadcast.css"><script type="module" src="./host.js"></script></head>
<body><main><header><a class="brand" href="/">ULTRASQUAD</a><a href="/console#live">К журналу действий ↗</a></header><h1>Видеоэфир</h1><p>Кадр формируется из действий UltraSquad. Можно смотреть его здесь или подключить одного зрителя.</p>
<div class="stage"><video id="video" autoplay muted playsinline controls></video><p id="status" aria-live="polite">Эфир остановлен</p></div>
<div class="broadcast-actions"><button id="start" type="button">Запустить эфир панели</button><button id="screen-share" type="button">Показать вкладку или окно</button><button id="stop" type="button" disabled>Остановить эфир</button></div>
<section class="connect"><h2>Подключить зрителя</h2><p>Отправьте приглашение зрителю и вставьте его ответ. Зритель увидит видео панели.</p><button id="invite" type="button" disabled>Создать приглашение</button><label for="offer">Код приглашения</label><textarea id="offer" rows="3" readonly></textarea><button id="copy" type="button" disabled>Копировать приглашение</button><label for="answer">Код ответа зрителя</label><textarea id="answer" rows="3" spellcheck="false"></textarea><button id="accept" type="button" disabled>Подключить зрителя</button><a id="viewer-link" href="./view" target="_blank" rel="noopener">Открыть страницу просмотра ↗</a><p id="peer" aria-live="polite"></p></section></main></body></html>
